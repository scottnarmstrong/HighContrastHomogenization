version: "v0.4"

project:
  name: "HighContrastHomogenization"
  description: >-
    A Lean 4 / Mathlib formalization of the paper "Homogenization at a
    polynomial scale in high contrast" (Armstrong, Kuusi, Loher): for
    stationary coefficient laws with unit range of dependence whose
    coarse-grained blocks are dominated by a reference block above a random
    source scale, entry into the small-contrast regime at a length polynomial
    in the reference aspect ratio and the source-tail growth constant
    (Theorem A), algebraic convergence of the annealed coarse-grained matrices
    (Theorem B), the uniformly elliptic model (Theorem C), and quantitative
    homogenization with correctors, a first-order Liouville theorem and
    large-scale regularity above a single random radius with an explicit
    two-part tail (Theorem D).  The formalization consumes the public
    CoarseGraining homogenization library as its analytic base.
  authors:
    - "Scott Armstrong"
    - "Tuomo Kuusi"
    - "Amélie Loher"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Scott Armstrong"
    - "Tuomo Kuusi"
    - "Amélie Loher"

classification:
  arxiv: ["math.AP", "math.PR"]
  msc2020: ["35B27", "35J15", "60K37"]

sources:
  - title: "Homogenization at a polynomial scale in high contrast"
    authors:
      - "Scott Armstrong"
      - "Tuomo Kuusi"
      - "Amélie Loher"
    type: "paper"
    location: "arXiv identifier to be added on posting"
    relationship: "formalizes"
    license: "all rights reserved"
    author_endorsement: "participated"
  - title: "Renormalization Group and Elliptic Homogenization in High Contrast"
    authors:
      - "Scott Armstrong"
      - "Tuomo Kuusi"
    type: "paper"
    id: "doi:10.1007/s00222-025-01370-9"
    location: "Inventiones Mathematicae 242 (2025), 895-1086"
    relationship: "background"
    note: "The high-contrast homogenization theory whose deductions Section 6 of the formalized paper uses; formalized in the CoarseGraining library."
    license: "all rights reserved"
    author_endorsement: "participated"

related_formalizations:
  - id: "https://github.com/scottnarmstrong/CoarseGraining"
    relationship: "builds-on"
    note: "The CoarseGraining library (Armstrong, Kuusi) supplies the coarse-graining, Sobolev and probabilistic base; this repository supersedes its earlier polynomial-scale high-contrast development."

status:
  scope: >-
    All four theorems of the paper's introduction are formalized and proved:
    Theorems A, B, C and D, exported in the paper's own form in
    HCPoly/MainResults.lean, each checked against a Mathlib-only restatement by
    the Lean comparator.  Rendering conventions (stated in the theorem
    docstrings and in CORRESPONDENCE.md): the coefficient space is the class
    of measurable fields, modulo almost-everywhere equality, that are locally
    uniformly elliptic, which is the class over which the paper states
    Theorem A (for Theorems B, C and D the paper's qualitative class is wider;
    the containment is proved and no constant depends on the ellipticity
    constants); Theorem A is proved and exported in the paper's printed form,
    the annealed contrast being at most 1 + sigma at every generation beyond
    the entry scale, together with the polynomial length bound on that scale;
    Theorem C is the instance of Theorem D for uniformly elliptic laws and its
    Dirichlet clause is exported in Theorem D's negative-Sobolev form rather than the
    paper's L^2 form with a forcing term; Theorem D's Dirichlet estimate is
    stated on normalized adapted cells of the homogenized matrix for supplied
    weak solutions, the random radius satisfies X >= 1 (the paper states
    X >= max(1, S)), and the homogenized matrix is produced existentially
    rather than identified with Theorem B's limit block.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "HCPoly.polynomial_entry"
      file: "HCPoly/MainResults.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "HCPolyAudit/PolynomialEntry/comparator.json"
      literature_dependencies: []
    - declaration: "HCPoly.algebraic_convergence"
      file: "HCPoly/MainResults.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "HCPolyAudit/AlgebraicConvergence/comparator.json"
      literature_dependencies: []
    - declaration: "HCPoly.uniform_homogenization"
      file: "HCPoly/MainResults.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "HCPolyAudit/UniformHomogenization/comparator.json"
      literature_dependencies: []
    - declaration: "HCPoly.polynomial_homogenization"
      file: "HCPoly/MainResults.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "HCPolyAudit/PolynomialHomogenization/comparator.json"
      literature_dependencies: []
    - declaration: "HCPoly.quenched_convergence"
      file: "HCPoly/MainResults.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: ""
      literature_dependencies: []

automation:
  methods:
    - method: "agent"
      models:
        - "claude-fable-5-1"
        - "claude-opus-5"
        - "gpt-5.6-sol"
        - "deepseek-v4.1-flash"
        - "claude-sonnet-5"
        - "claude-fable-5"
        - "gpt-5.6-terra"
      framework: >-
        Claude Code (Anthropic) and Codex (OpenAI) agentic coding harnesses,
        with DeepSeek workers driven through ollama for the Lean v4.33 upgrade.
        Claude Fable 5.1 orchestrated the campaign (planning, statement design,
        dispatch and review of the work); the proving, auditing and rewriting
        agents were mostly Claude Opus 5 and GPT-5.6 Sol at low reasoning
        effort; the toolchain upgrade was carried out by DeepSeek V4.1 Flash
        workers with Claude Sonnet 5 on escalations.  The polynomial-entry
        route by which Theorem A is proved was developed afterwards on the same
        harnesses, with Claude Fable 5.1 orchestrating and Claude Opus 5 and
        GPT-5.6 Sol at low reasoning effort writing the proofs; its port to
        Lean v4.33.0 and its merge into this library were carried out by
        DeepSeek V4.1 Flash workers with Claude Sonnet 5 on escalations; and
        the consolidation of that route on 17-18 September 2026 - using the
        published proofs for the results shared with them, regrouping the
        response layer by its mathematics, renaming after what each
        declaration states, narrowing the arithmetic closers to the facts
        they use and removing the modules no exported theorem reaches - was
        written by DeepSeek V4.1 Flash workers, with Claude Sonnet 5 on
        escalations and review, Claude Opus 5 leading each phase and Claude
        Fable 5.1 orchestrating.
      tool_setup: >-
        Lake builds under leanprover/lean4:v4.33.0 with Mathlib v4.33.0 and the
        public CoarseGraining library at a pinned revision.  A frozen-statement
        manifest with content hashes bound the certified statement surface
        during development; every sealed theorem was certified by a two-key
        process (a prover chain plus an independent adversarial audit by a
        fresh model instance).  Read-only subagents were used for hostile
        statement audits, dependency-order verification, and dead-code
        analysis.  The Lean comparator was run locally on every comparator pair,
        with the NanoDa kernel replay.
      cost:
        wall_time: >-
          about two and a half weeks of agentic work: the certified statement
          surface and the proofs of the main theorems were completed between
          21 August and 3 September 2026, followed by three days of dead-code,
          naming and comment cleanup (4-6 September), one day (11 September)
          for the public release (main-results module, the exports of Theorems B
          and C, the four comparator pairs, and the citation rewrite), and one
          night (13-14 September) for the upgrade to Lean v4.33.0; and a
          further stretch from 6 to 17 September 2026 in which Theorem A was
          proved along the paper's own route in its printed form, and that
          route was ported to Lean v4.33.0 and merged into this library; and
          two days (17-18 September 2026) in which that route was consolidated
        spend_usd: "not separately tracked (subscription accounts)"
        hardware: "a 16-CPU / 124 GB RAM Ubuntu machine"
      prompting_notes: >-
        Human-directed agent work, closely supervised by the authors, with
        author rulings recorded verbatim for every statement-level decision.
  spend_usd: "not separately tracked (subscription accounts)"
  notes: >-
    All Lean code in this repository was written by the listed large language
    models under the close supervision of the authors: Claude Fable 5.1
    orchestrated, and the agents doing the proofs, audits and rewrites were
    mostly Claude Opus 5 and GPT-5.6 Sol (low reasoning effort).  Every proof
    is checked by the Lean
    kernel and Mathlib; the verified library contains no sorry and no custom
    axiom.  The Mathlib-only comparator challenge files
    (HCPolyAudit/*/Challenge.lean) each contain exactly one intentional
    statement-level sorry (the theorem body), which is filled by the
    corresponding HCPolyAudit/*/Solution.lean and checked by leanprover/comparator.

fidelity:
  divergences: >-
    Rendering conventions, each stated in the theorem docstrings and in
    CORRESPONDENCE.md: the coefficient space is the class of measurable
    fields, modulo almost-everywhere equality, that are locally uniformly
    elliptic, which is the class over which the paper states Theorem A (for
    Theorems B, C and D the paper's qualitative class is wider; the
    containment is proved and no constant depends on the ellipticity
    constants); Theorem A is proved and exported in the paper's printed form,
    with one tolerance sigma and the contrast bound at every generation beyond
    the entry scale, so no reformulation stands between the proved statement
    and the printed one; Theorem C is the instance of Theorem D for
    uniformly elliptic laws, with the Dirichlet clause in Theorem D's
    negative-Sobolev form rather than the paper's L^2 form with a forcing
    term; Theorem D's Dirichlet estimate is stated on normalized adapted
    cells of the homogenized matrix for supplied weak solutions, with an
    endpoint constant depending on two trapping radii, the random radius
    satisfies X >= 1 (the paper states X >= max(1, S)), the homogenized
    matrix is produced existentially rather than identified with Theorem B's
    limit block, norms are valued in the extended nonnegative reals, and
    fluxes are written for the skew-centered field.  The consolidation of
    17-18 September 2026 left the seventeen printed statements of the route
    unchanged beyond their import lines and three declaration renames
    (logDetLoss to detIncrement, synchronizedLogDetLoss to synchCharge,
    MemLqSchatten to SchattenMemLp), and left every exported statement
    byte-identical.

review:
  status: "author-verified"
  reviewers:
    - "Scott Armstrong"
    - "Tuomo Kuusi"
    - "Amélie Loher"
  notes: >-
    Correctness of every proof is guaranteed by the Lean kernel and Mathlib
    (no sorry, no custom axiom).  The authors reviewed the public statements
    and ruled on every statement-level decision during development; each
    certified theorem was additionally checked by an independent adversarial
    audit of the sealed statement and its proof cone.  This is not external
    peer review.

alignment:
  namespace: "HCPoly"
  statements:
    - source: "Theorem A (t.polynomial.entry)"
      lean: "HCPoly.polynomial_entry"
      module: "HCPoly.MainResults"
      status: "proved"
      note: "Proved along the paper's own route, whose propositions are the theorems of HCPoly/Entry/Statements/, and exported in the printed form: the annealed contrast is at most 1 + sigma at every generation beyond the entry scale. Comparator-audited via HCPolyAudit/PolynomialEntry/."
    - source: "Theorem B (t.algebraic.convergence)"
      lean: "HCPoly.algebraic_convergence"
      module: "HCPoly.MainResults"
      status: "proved"
      note: "Comparator-audited via HCPolyAudit/AlgebraicConvergence/."
    - source: "Theorem C (t.uniform.homogenization)"
      lean: "HCPoly.uniform_homogenization"
      module: "HCPoly.MainResults"
      status: "proved"
      note: "The instance of Theorem D for uniformly elliptic laws; the Dirichlet clause is exported in Theorem D's negative-Sobolev form. Comparator-audited via HCPolyAudit/UniformHomogenization/."
    - source: "Theorem D (t.random.homogenization)"
      lean: "HCPoly.polynomial_homogenization"
      module: "HCPoly.MainResults"
      status: "proved"
      note: "Comparator-audited via HCPolyAudit/PolynomialHomogenization/."

